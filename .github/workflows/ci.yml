name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Frontend - Install and Build
      working-directory: ./frontend
      run: |
        npm ci
        npm run build
        npm run test
        npm run lint

    - name: Backend - Install and Test
      working-directory: ./backend
      run: |
        # System dependencies for PyAudio / etc if needed in CI
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
        bash run_tests.sh
