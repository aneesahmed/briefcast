[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "briefcast"
version = "0.1.0"
description = "Stateful document processing orchestration with Gemini LLM/TTS APIs for Urdu audio broadcasts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.1.8,<1.0.0",
    "langchain-core>=1.4.0,<2.0.0",
    "google-genai>=1.65.0,<3.0.0",
    "langchain-google-genai>=4.0.0,<5.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn>=0.30.1,<1.0.0",
    "websockets>=13.0,<16.0.0",
    "pypdf>=4.0.0,<5.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "pyaudio>=0.2.14,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "requests>=2.34.2,<3.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "tinydb>=4.9.0,<5.0.0",
    "langchain-community>=0.4.2,<1.0.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "transformers>=5.14.1,<6.0.0",
    "torch>=2.13.0,<3.0.0",
    "scipy>=1.18.0,<2.0.0",
    "pandas>=2.2.0,<4.0.0",
    "xlrd>=2.0.1,<3.0.0",
    "pandas-stubs~=3.0.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.5.0",
]

[project.scripts]
start-briefcast = "src.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
