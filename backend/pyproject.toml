[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "briefcast"
version = "0.1.0"
description = "Folder-driven Gemini summarization, Urdu translation, and audio API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=1.65.0,<3.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn>=0.30.1,<1.0.0",
    "websockets>=13.0,<16.0.0",
    "pypdf>=4.0.0,<5.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "lameenc>=1.8.1,<2.0.0",
    "sqlalchemy>=2.0.52",
    "aiosqlite>=0.22.1",
    "tzdata>=2026.4",
    "langgraph>=1.2.11",
    "langchain-google-genai>=4.3.7",
    "filetype>=1.2.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
