[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "briefcast"
version = "0.1.0"
description = "Stateful document processing orchestration with Gemini LLM/TTS APIs for Urdu audio broadcasts"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.1.8",
    "langchain-core>=0.2.10",
    "google-genai>=0.1.2",
    "langchain-google-genai>=1.0.8",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "websockets>=12.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.1",
    "pyaudio>=0.2.14",
    "python-dotenv>=1.0.1",
    "requests>=2.34.2",
    "python-multipart>=0.0.32",
    "tinydb>=4.9.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "transformers>=5.14.1",
    "torch>=2.13.0",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.5.0",
]

[project.scripts]
start-briefcast = "src.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
