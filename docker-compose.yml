services:
  briefcast:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./briefing_source:/app/briefing_source
      - ./processed_files:/app/processed_files
      - ./failed_files:/app/failed_files
    env_file:
      - ./backend/.env
    restart: unless-stopped
